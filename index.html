    // Web Audio Synthesizer: 100% Procedural Audio Engine
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playClack(freq = 980, duration = 0.08) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + duration);

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(freq * 1.2, this.ctx.currentTime);
          filter.Q.setValueAtTime(3.5, this.ctx.currentTime);

          gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playBlip(freq = 440) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch(e) {}
      }
      playFanfare() {
        if (this.muted) return;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          setTimeout(() => this.playBlip(f), i * 90);
        });
      }
      playBuzz() {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.22);
        } catch(e) {}
      }
    }

    function DandiyaArcadeCanvas({ onClash }) {
      const canvasRef = useRef(null);
      const stateRef = useRef({
        rot: 0,
        clashAnim: 0,
        particles: [],
        mouse: { x: 0, y: 0, active: false }
      });

      const triggerClashEffect = useCallback((x, y) => {
        audio.playClack(850 + Math.random() * 350);
        stateRef.current.clashAnim = 1.0;
        // spawn festive sparks
        for (let i = 0; i < 22; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * 5.5;
          stateRef.current.particles.push({
            x: x || 0,
            y: y || 0,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 1.0,
            color: Math.random() > 0.5 ? '#ff1493' : '#ffd700',
            size: 3 + Math.random() * 3
          });
        }
        if (onClash) onClash();
      }, [onClash]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const resize = () => {
          const rect = canvas.getBoundingClientRect();
          canvas.width = rect.width * (window.devicePixelRatio || 1);
          canvas.height = rect.height * (window.devicePixelRatio || 1);
          ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
        };
        resize();
        window.addEventListener('resize', resize);

        const render = () => {
          const dpr = window.devicePixelRatio || 1;
          const width = canvas.width / dpr;
          const height = canvas.height / dpr;
          const cx = width / 2;
          const cy = height / 2;
          const s = stateRef.current;

          ctx.clearRect(0, 0, width, height);

          // 1. Draw glowing cyberpunk floor mandala
          ctx.save();
          ctx.translate(cx, cy);
          s.rot += 0.007;
          ctx.rotate(s.rot);

          ctx.strokeStyle = 'rgba(138, 43, 226, 0.28)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(0, 0, 105, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(0, 255, 255, 0.35)';
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.arc(0, 0, 80, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);

          for (let i = 0; i < 8; i++) {
            ctx.rotate(Math.PI / 4);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -85);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, -85, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
          }
          ctx.restore();

          // 2. Interactive Dandiya Sticks with Clash Physics
          if (s.clashAnim > 0) {
            s.clashAnim -= 0.06;
          }
          const clashOffset = Math.sin(s.clashAnim * Math.PI) * 45;

          const drawStick = (x, y, angle, baseColor, glowColor) => {
            ctx.save();
            ctx.translate(cx + x, cy + y);
            ctx.rotate(angle);
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 18;

            const grad = ctx.createLinearGradient(-6, -65, 6, 65);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.3, baseColor);
            grad.addColorStop(0.8, '#4a0e4e');
            grad.addColorStop(1, '#ffd700');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(-6, -65, 12, 130, 6);
            ctx.fill();

            // Festive golden rings
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(-6, -38, 12, 3.5);
            ctx.fillRect(-6, -18, 12, 3.5);
            ctx.fillRect(-6, 28, 12, 7);

            // Tip jewel
            ctx.beginPath();
            ctx.arc(0, -65, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = '#00ffff';
            ctx.fill();

            ctx.restore();
          };

          const mx = s.mouse.active ? (s.mouse.x - cx) * 0.08 : 0;
          const my = s.mouse.active ? (s.mouse.y - cy) * 0.08 : 0;

          // Stick 1 (Left - Pink)
          const s1X = -48 + clashOffset + mx;
          const s1Ang = -0.35 + (s.clashAnim * 0.48);
          drawStick(s1X, my, s1Ang, '#ff1493', 'rgba(255, 20, 147, 0.8)');

          // Stick 2 (Right - Cyan)
          const s2X = 48 - clashOffset + mx;
          const s2Ang = 0.35 - (s.clashAnim * 0.48);
          drawStick(s2X, my, s2Ang, '#00ffff', 'rgba(0, 255, 255, 0.8)');

          // 3. Sparks & Particles
          for (let i = s.particles.length - 1; i >= 0; i--) {
            const p = s.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.035;
            if (p.life <= 0) {
              s.particles.splice(i, 1);
              continue;
            }
            ctx.save();
            ctx.translate(cx + p.x, cy + p.y);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(0, 0, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          animId = requestAnimationFrame(render);
        };

        render();

        const handlePointerDown = (e) => {
          const rect = canvas.getBoundingClientRect();
          const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left - rect.width / 2;
          const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top - rect.height / 2;
          triggerClashEffect(x, y);
        };

        const handlePointerMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const clientY = e.clientY || (e.touches && e.touches[0].clientY);
          if (clientX && clientY) {
            stateRef.current.mouse = {
              x: clientX - rect.left,
              y: clientY - rect.top,
              active: true
            };
          }
        };

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: true });
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('touchmove', handlePointerMove, { passive: true });

        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animId);
          canvas.removeEventListener('mousedown', handlePointerDown);
          canvas.removeEventListener('touchstart', handlePointerDown);
          canvas.removeEventListener('mousemove', handlePointerMove);
          canvas.removeEventListener('touchmove', handlePointerMove);
        };
      }, [triggerClashEffect]);

      return (
        <div className="relative w-full h-64 md:h-72 flex items-center justify-center cursor-pointer select-none">
          <canvas ref={canvasRef} className="w-full h-full block" />

    function GarbaverseRhythmArcade({ onComplete }) {
      const [score, setScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [timeLeft, setTimeLeft] = useState(20);
      const [lanes, setLanes] = useState([
        { id: 1, name: 'LEFT', key: 'A', hitText: '' },
        { id: 2, name: 'CLASH', key: 'S', hitText: '' },
        { id: 3, name: 'RIGHT', key: 'D', hitText: '' }
      ]);
      const [targetLane, setTargetLane] = useState(2);
      const [isGameOver, setIsGameOver] = useState(false);

      useEffect(() => {
        if (timeLeft <= 0) {
          setIsGameOver(true);
          audio.playFanfare();
          return;
        }
        const timer = setInterval(() => {
          setTimeLeft(t => t - 1);
        }, 1000);
        return () => clearInterval(timer);
      }, [timeLeft]);

      useEffect(() => {
        if (isGameOver) return;
        const beatInterval = setInterval(() => {
          const next = Math.floor(Math.random() * 3) + 1;
          setTargetLane(next);
        }, 800);
        return () => clearInterval(beatInterval);
      }, [isGameOver]);

      const triggerHit = (laneId) => {
        if (isGameOver) return;
        if (laneId === targetLane) {
          audio.playClack(1050);
          setScore(s => s + 100 * (combo + 1));
          setCombo(c => c + 1);
          setLanes(prev => prev.map(l => l.id === laneId ? { ...l, hitText: 'PERFECT! 🪩' } : l));
        } else {
          audio.playBuzz();
          setCombo(0);
          setLanes(prev => prev.map(l => l.id === laneId ? { ...l, hitText: 'MISS 💀' } : l));
        }

        setTimeout(() => {
          setLanes(prev => prev.map(l => l.id === laneId ? { ...l, hitText: '' } : l));
        }, 350);
      };

      // Keyboard support
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (isGameOver) return;
          if (e.key === 'a' || e.key === 'A') triggerHit(1);
          if (e.key === 's' || e.key === 'S' || e.key === ' ') triggerHit(2);
          if (e.key === 'd' || e.key === 'D') triggerHit(3);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isGameOver, targetLane, combo]);

      return (
        <div className="w-full max-w-md mx-auto p-4 bg-cyberSurface/90 border border-cyberBorder rounded-2xl flex flex-col items-center">
          <div className="w-full flex justify-between items-center mb-4 font-mono text-xs sm:text-sm">
            <div className="text-cyberCyan">SCORE: <span className="font-bold text-base sm:text-lg text-white">{score}</span></div>
            <div className="text-festiveGold">COMBO: <span className="font-bold text-base sm:text-lg text-neonPink">{combo}x</span></div>
            <div className="text-rose-400">TIME: <span className="font-bold text-base sm:text-lg text-white">{timeLeft}s</span></div>
          </div>

          {!isGameOver ? (
            <div className="w-full space-y-4">
              <div className="h-28 bg-cyberBlack/70 rounded-xl border border-cyberBorder/50 flex items-center justify-around p-2 relative overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-r from-neonPink/5 via-cyberCyan/5 to-festiveGold/5 animate-pulse" />
                {[1, 2, 3].map((l) => (
                  <div 
                    key={l}
                    className={`w-20 h-20 rounded-xl flex flex-col items-center justify-center font-bold transition-all duration-150 ${
                      targetLane === l 
                        ? 'border-2 border-festiveGold bg-neonPink/30 scale-105 shadow-[0_0_20px_rgba(255,20,147,0.8)]' 
                        : 'border border-cyberBorder bg-cyberSurface/40 opacity-40'
                    }`}
                  >
                    <span className="text-xl">{l === 1 ? '🥢' : l === 2 ? '🪩' : '🥢'}</span>
                    <span className="text-[10px] font-mono text-white/80">LANE {l}</span>
                  </div>
                ))}
              </div>

              {/* Tap Controls */}
              <div className="grid grid-cols-3 gap-2">
                {lanes.map((lane) => (
                  <button
                    key={lane.id}
                    onClick={() => triggerHit(lane.id)}
                    className="h-20 bg-gradient-to-b from-cyberBorder to-cyberSurface border border-neonPink/40 rounded-xl active:scale-95 flex flex-col items-center justify-center relative overflow-hidden group hover:border-cyberCyan"
                  >
                    <span className="text-[10px] font-mono text-white/60">[{lane.key}]</span>
                    <span className="text-xs sm:text-sm font-bold text-white tracking-wider">{lane.name}</span>
                    {lane.hitText && (
                      <span className="absolute inset-0 flex items-center justify-center bg-cyberBlack/90 text-[11px] font-bold text-festiveGold animate-bounce">
                        {lane.hitText}
                      </span>
                    )}
                  </button>
                ))}
              </div>
              <p className="text-[10px] text-center font-mono text-white/50">
                Hit highlighted lane in sync with the beat. Keys A / S / D supported!
              </p>
            </div>
          ) : (
            <div className="text-center py-6 space-y-4 w-full">
              <div className="text-4xl animate-bounce">🏆</div>
              <h3 className="text-xl font-bold text-cyberCyan">GARBAVERSE TRIALS CLEARED!</h3>
              <p className="text-sm text-gray-300 font-mono">
                FINAL SCORE: <span className="text-festiveGold font-bold">{score} PTS</span>
              </p>
              <p className="text-xs text-white/70 italic px-4">
                "Your motor coordination exceeds the minimum threshold required to not send Ved to the emergency ward."
              </p>
              <button
                onClick={() => onComplete(score)}
                className="w-full py-3 bg-gradient-to-r from-neonPink to-electricViolet text-white font-bold rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all text-sm uppercase tracking-wider"
              >
                COLLECT RECRUITMENT XP & ADVANCE →
              </button>
            </div>
          )}
        </div>
      );
    }

            <div className="w-full max-w-xl text-center text-[10px] font-mono text-gray-500 py-1">
              Real-time synchronization testing. No external models or bloated packages loaded.
            </div>
          </main>
        );
      }

      if (stage === 6) {
        return (
          <main className="min-h-screen flex flex-col items-center justify-between p-4 bg-cyberBlack relative overflow-hidden" aria-label="Final Boss Approach Screen">
            <div className="absolute inset-0 scanline opacity-40" />

            <div className="w-full max-w-md my-auto cyber-card p-6 md:p-8 rounded-3xl border border-neonPink/60 shadow-2xl relative z-10 text-center space-y-6 animate-slideDown">
              <div className="w-16 h-16 mx-auto bg-festiveGold/20 border border-festiveGold rounded-full flex items-center justify-center text-3xl animate-bounce">
                🪩
              </div>

              <div className="space-y-2">
                <span className="text-[10px] font-mono text-cyberCyan tracking-widest uppercase">
                  FINAL BOSS STAGE // ALL TRIALS CLEARED
                </span>
                <h2 className="text-2xl sm:text-3xl font-black text-white font-festive">
                  YOU HAVE SURVIVED THE LORE.
                </h2>
                <p className="text-xs text-gray-300 font-mono leading-relaxed">
                  You decoded this man's entire personality operating system. You witnessed the ridiculous amount of frontend engineering poured into a Navratri invite.
                </p>
              </div>

              <div className="p-4 bg-cyberBlack/80 border border-cyberBorder rounded-2xl text-left">
                <div className="text-[10px] font-mono text-neonPink uppercase font-bold mb-1">
                  ONE FINAL INQUIRY REMAINS:
                </div>
                <div className="text-sm sm:text-base font-bold text-white">
                  "Would you like to be Ved's voluntary dandiya partner?"
                </div>
              </div>

              <div className="space-y-3 pt-2">
                <button
                  onClick={() => {
                    audio.playFanfare();
                    setFinalChoice("YES");
                    setStage(7);
                  }}
                  className="w-full py-4 bg-gradient-to-r from-neonPink via-purple-600 to-festiveGold font-bold text-white rounded-xl shadow-[0_0_20px_rgba(255,20,147,0.6)] hover:brightness-110 active:scale-95 transition-all text-xs sm:text-sm tracking-wider flex items-center justify-center gap-2"
                >
                  <span>YES, LET'S MAKE SOME LORE 🪩</span>
                </button>

                <button
                  onClick={() => {
                    audio.playBlip(600);
                    setFinalChoice("INTERESTED");
                    setStage(7);
                  }}
                  className="w-full py-3.5 bg-cyberSurface border border-cyberCyan text-cyberCyan font-bold rounded-xl hover:bg-cyberCyan/10 active:scale-95 transition-all text-xs tracking-wider"
                >
                  I'M INTERESTED — LET'S TALK FIRST 👀
                </button>

                <button
                  onClick={() => {
                    audio.playBlip(440);
                    setFinalChoice("JUST_GAMES");
                    setStage(7);
                  }}
                  className="w-full py-3 bg-cyberBlack border border-cyberBorder text-gray-400 font-mono text-xs rounded-xl hover:text-white transition-all"
                >
                  I'M JUST HERE FOR THE XP & MEMES 💀
                </button>
              </div>

              <p className="text-[10px] text-gray-500 font-mono">
                No obligations. No pressure. Zero emotional manipulation protocols deployed.
              </p>
            </div>
          </main>
        );
      }

      if (stage === 7) {
        const getVerdictCopy = () => {
          if (finalChoice === "YES") {
            return {
              badge: "OFFICIALLY CANDIDATE #001",
              title: "APPLICATION APPROVED 🪩",
              desc: "Ved's romantic subsystem is buffering aggressively. No guarantees about dance synchronisation, but unlimited potential for laughing at mutual awkwardness."
            };
          } else if (finalChoice === "INTERESTED") {
            return {
              badge: "SLOW-BURN ARC INITIATED",
              title: "DIPLOMATIC TALKS OPEN 👀",
              desc: "Zero deadlines. Zero expectations. Start with a normal conversation, inspect the vibe, and see if Garba makes sense."
            };
          } else {
            return {
              badge: "XP FARMER EXTRAORDINAIRE",
              title: "LEGACY SECURED 💀",
              desc: "You came. You played. You acquired a concerning amount of intel on Ved. You owe nobody a date. Stay legendary."
            };
          }
        };

        const verdict = getVerdictCopy();
        const shareSummaryText = `🪩 FIND MY VED: THE DANDIYA RECRUITMENT TRIALS\nScore: ${xp} XP\nBadge: ${personalityBadge}\nVerdict: ${verdict.title}\n"Dandiya partner ki vacancy hai. HR department mentally unstable hai."`;

        const handleCopyShare = () => {
          navigator.clipboard.writeText(shareSummaryText);
          setCopiedToast(true);
          setTimeout(() => setCopiedToast(false), 2500);
        };

        const handleContactVed = () => {
          window.open("https://www.instagram.com/ulkapind_unpinned/", "_blank", "noopener,noreferrer");
        };

        const handleWhatsAppVed = () => {
          // The number is not printed on the page, but a wa.me link is discoverable in page source.
          window.open("https://wa.me/917906771654?text=" + encodeURIComponent("Hi Ved! I found your Find My Ved Dandiya Recruitment Trials website 🪩"), "_blank", "noopener,noreferrer");
        };

        const handleTransmitDossier = async () => {
          if (isSubmittingApplication) return;
          setIsSubmittingApplication(true);
          setTransmissionStatus("Transmitting your application… 💌");
          const formPayload = {
            name: applicantName.trim(),
            instagram: instagramHandle.trim() || "Not provided",
            contact: applicantContact.trim() || "Not provided",
            message: applicantMessage.trim() || "No additional message",
            quiz_score: `${xp} XP`,
            badge: personalityBadge,
            verdict: verdict.title,
            _subject: `Find My Ved application — ${applicantName.trim() || "New applicant"}`,
            _template: "table"
          };

          try {
            const response = await fetch("https://formsubmit.co/ajax/vednat2024@gmail.com", {
              method: "POST",
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              body: JSON.stringify(formPayload)
            });
            const result = await response.json();
            if (!response.ok || result.success !== "true") {
              throw new Error(result.message || "Submission was not accepted");
            }
            setTransmissionStatus("Application sent successfully! Ved will receive your details by email. You can also DM him on Instagram 💖");
          } catch (error) {
            setTransmissionStatus("Couldn't send automatically. The email form may still need activation, or the connection failed. Please DM Ved on Instagram instead.");
          } finally {
            setIsSubmittingApplication(false);
          }
        };

        return (
          <main className="min-h-screen flex flex-col items-center justify-start p-4 md:p-6 bg-cyberBlack relative overflow-y-auto" aria-label="Final Dossier and Share Screen">
            <div className="w-full max-w-lg space-y-6 my-4">
              
              {/* Instagram Story 9:16 Style Visual Card */}
              <div id="story-card" className="w-full bg-gradient-to-b from-cyberSurface via-cyberBlack to-cyberSurface border-2 border-neonPink rounded-3xl p-6 shadow-[0_0_40px_rgba(255,20,147,0.35)] relative overflow-hidden text-center space-y-4">
                <div className="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-neonPink via-cyberCyan to-festiveGold" />
                
                <div className="flex justify-between items-center text-[10px] font-mono text-gray-400">
                  <span>FIND MY VED // 2026</span>
                  <span className="text-festiveGold font-bold">TOTAL XP: {xp}</span>
                </div>

                <div className="w-14 h-14 mx-auto rounded-2xl bg-neonPink/20 border border-neonPink flex items-center justify-center text-3xl">
                  {finalChoice === "YES" ? "🪩" : finalChoice === "INTERESTED" ? "✨" : "👾"}
                </div>

                <div>
                  <span className="text-[10px] font-mono uppercase tracking-widest text-cyberCyan px-2.5 py-1 bg-cyberBorder/60 rounded-full">
                    {verdict.badge}
                  </span>
                  <h3 className="text-2xl font-black text-white font-festive mt-2">
                    {verdict.title}
                  </h3>
                  <p className="text-xs text-gray-300 font-mono mt-2 leading-relaxed px-2">
                    {verdict.desc}
                  </p>
                </div>

                <div className="p-3 bg-cyberBlack/80 border border-cyberBorder rounded-xl inline-block">
                  <div className="text-[9px] font-mono text-gray-400 uppercase">UNLOCKED ARCHETYPE</div>
                  <div className="text-sm font-bold text-festiveGold">{personalityBadge}</div>
                </div>

                <div className="pt-2 text-[10px] font-mono text-cyberCyan/70">
                  find-my-ved.vercel.app • share on story
                </div>
              </div>

              {/* Action Buttons */}
              <div className="grid grid-cols-2 gap-3">
                <button
                  onClick={handleCopyShare}
                  className="py-3 px-3 bg-cyberSurface border border-cyberCyan text-cyberCyan font-mono text-xs font-bold rounded-xl hover:bg-cyberCyan/10 active:scale-95 transition-all flex items-center justify-center gap-1.5"
                >
                  <span>{copiedToast ? "COPIED TO CLIPBOARD! 🚀" : "COPY STORY RESULT 📋"}</span>
                </button>
                <button
                  onClick={() => {
                    setStage(1);
                    setCurrentQIndex(0);
                    setSelectedOption(null);
                  }}
                  className="py-3 px-3 bg-cyberSurface border border-cyberBorder text-gray-300 font-mono text-xs font-bold rounded-xl hover:text-white active:scale-95 transition-all"
                >
                  REPLAY SIMULATION ↺
                </button>
              </div>

              <button
                onClick={handleContactVed}
                className="w-full py-3 px-4 bg-gradient-to-r from-[#833ab4] via-[#fd1d1d] to-[#fcb045] text-white font-bold rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all text-sm uppercase tracking-wider"
              >
                DM VED ON INSTAGRAM ↗ @ULKAPIND_UNPINNED
              </button>
              <button
                onClick={handleWhatsAppVed}
                className="w-full py-3 px-4 bg-[#128C7E] text-white font-bold rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all text-sm uppercase tracking-wider"
              >
                OPTIONAL: MESSAGE VED ON WHATSAPP ↗
              </button>

              {/* Voluntary Connection Form (Only if interested) */}
              {(finalChoice === "YES" || finalChoice === "INTERESTED") && (
                <div className="cyber-card p-6 rounded-3xl border border-electricViolet/50 space-y-4">
                  <div className="space-y-1">
                    <span className="text-xs font-mono text-neonPink uppercase font-bold">
                      OPTIONAL TRANSMISSION LINK
                    </span>
                    <h4 className="text-base sm:text-lg font-bold text-white">
                      Drop an Instagram handle or Alias
                    </h4>
                    <p className="text-xs text-gray-400 font-mono">
                      Completely voluntary. If you prefer, just DM him directly with a screenshot of this card!
                    </p>
                  </div>

                  <div className="space-y-3 font-mono text-xs">
                    <div>
                      <label className="block text-gray-300 mb-1">YOUR NICKNAME / CODENAME</label>
                      <input
                        type="text"
                        value={applicantName}
                        onChange={(e) => setApplicantName(e.target.value)}
                        placeholder="e.g. Saree Connoisseur"
                        className="w-full p-3 bg-cyberBlack border border-cyberBorder rounded-xl text-white focus:border-neonPink outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-gray-300 mb-1">INSTAGRAM @HANDLE (OPTIONAL)</label>
                      <input
                        type="text"
                        value={instagramHandle}
                        onChange={(e) => setInstagramHandle(e.target.value)}
                        placeholder="@username"
                        className="w-full p-3 bg-cyberBlack border border-cyberBorder rounded-xl text-white focus:border-neonPink outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-gray-300 mb-1">YOUR EMAIL OR WHATSAPP (OPTIONAL)</label>
                      <input
                        type="text"
                        value={applicantContact}
                        onChange={(e) => setApplicantContact(e.target.value)}
                        placeholder="How should Ved reach you?"
                        className="w-full p-3 bg-cyberBlack border border-cyberBorder rounded-xl text-white focus:border-cyberCyan outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-gray-300 mb-1">MESSAGE (OPTIONAL)</label>
                      <textarea
                        value={applicantMessage}
                        onChange={(e) => setApplicantMessage(e.target.value)}
                        placeholder="Anything Ved should know?"
                        rows="3"
                        className="w-full p-3 bg-cyberBlack border border-cyberBorder rounded-xl text-white focus:border-cyberCyan outline-none resize-y"
                      />
                    </div>

                    <label className="flex items-start gap-2 pt-1 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={consentGiven}
                        onChange={(e) => setConsentGiven(e.target.checked)}
                        className="mt-1 accent-neonPink rounded"
                      />
                      <span className="text-[11px] text-gray-300 leading-tight">
                        I am happy for Ved to reach out about Navratri dandiya plans. Zero spam guaranteed.
                      </span>
                    </label>

                    <button
                      disabled={!consentGiven || (!applicantName.trim() && !instagramHandle.trim() && !applicantContact.trim()) || isSubmittingApplication}
                      onClick={handleTransmitDossier}
                      className="w-full py-3 bg-gradient-to-r from-neonPink to-electricViolet text-white font-bold rounded-xl disabled:opacity-30 disabled:cursor-not-allowed hover:brightness-110 transition-all uppercase tracking-wider"
                    >
                      {isSubmittingApplication ? "SENDING APPLICATION…" : "SEND APPLICATION TO VED 💌"}
                    </button>
                    {transmissionStatus && (
                      <p role="status" className="text-xs text-cyberCyan leading-relaxed">{transmissionStatus}</p>
                    )}
                    <p className="text-[10px] text-gray-500 leading-relaxed">
Your application is sent to Ved by email through FormSubmit. Your details are shared only if you choose to submit and agree above. Instagram DM is also available as a direct contact option.
                    </p>
                  </div>
                </div>
              )}

              {/* Official Job Posting Parody Card */}
              <div className="p-5 bg-cyberSurface/60 border border-cyberBorder rounded-2xl font-mono text-[11px] text-gray-400 space-y-2">
                <div className="text-festiveGold font-bold text-xs uppercase">
                  🚨 OFFICIAL VACANCY ADVERTISEMENT
                </div>
                <p><strong>Organization:</strong> Ved Enterprises (Emotionally Unstable Division)</p>
                <p><strong>Role:</strong> Voluntary Navratri Dandiya Partner</p>
                <p><strong>Perks:</strong> High-tier street snacks, 0 pressure, unlimited terrible tech jokes.</p>
                <p><strong>Founder Disclaimer:</strong> The founder is not legally liable for awkward pauses or sudden 2 AM philosophical discussions about chai.</p>
              </div>

            </div>
          </main>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
